<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 950" width="720" height="950" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <style>
    .n { fill: #EFEFF2; stroke: rgba(23,23,23,0.16); stroke-width: 1; }
    .cont { fill: none; stroke: rgba(23,23,23,0.16); stroke-width: 1.5; stroke-dasharray: 7 6; }
    .nb { fill: #F2F7FF; stroke: #4B3FE3; stroke-width: 1.2; }
    .ok { fill: #E9FAF2; stroke: #1DC981; stroke-width: 1.2; }
    .ng { fill: #FDECEA; stroke: #E8463A; stroke-width: 1.2; }
    .th { fill: #171717; font-size: 14px; font-weight: 500; }
    .tbr { fill: #1A1759; font-size: 14px; font-weight: 500; }
    .ts { fill: #52525B; font-size: 12px; }
    .tsd { fill: #E8463A; font-size: 12px; }
    .cnum { fill: #52525B; font-size: 12px; font-weight: 500; }
    .arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .chip { fill: #E4E4E7; }
    .capsule { fill: #E4E4E7; }
  </style>
  <defs>
    <marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>

  <rect class="cont" x="100" y="132" width="460" height="292" rx="12"/>
  <rect class="cont" x="100" y="564" width="460" height="156" rx="12"/>

  <path class="arr" d="M330 96 V130" marker-end="url(#aw)"/>
  <path class="arr" d="M330 424 V468" marker-end="url(#aw)"/>
  <path class="arr" d="M330 526 V562" marker-end="url(#aw)"/>
  <path class="arr" d="M330 720 V748" marker-end="url(#aw)"/>
  <path class="arr" d="M330 852 V882" marker-end="url(#aw)"/>
  <path class="arr" d="M502 800 H552" marker-end="url(#aw)"/>

  <rect class="n" x="195" y="52" width="270" height="44" rx="22"/>
  <text class="th" x="330" y="79" text-anchor="middle">前置：Focus 校准已完成</text>

  <text class="th" x="124" y="160">校准 · 4 种晶圆模型依次执行</text>
  <text class="ts" x="124" y="180">DSW · Undefined · Haze · ShinyWafer</text>

  <rect class="n" x="124" y="192" width="412" height="40" rx="8"/>
  <circle class="chip" cx="146" cy="212" r="10"/>
  <text class="cnum" x="146" y="216" text-anchor="middle">1</text>
  <text class="th" x="166" y="217">定位晶圆区域：左上+右下中点</text>

  <rect class="n" x="124" y="244" width="412" height="40" rx="8"/>
  <circle class="chip" cx="146" cy="264" r="10"/>
  <text class="cnum" x="146" y="268" text-anchor="middle">2</text>
  <text class="th" x="166" y="269">ECS 扫描：5X 匀速扫描 · 50X 采图</text>

  <rect class="nb" x="124" y="296" width="412" height="40" rx="8"/>
  <circle class="chip" cx="146" cy="316" r="10"/>
  <text class="cnum" x="146" y="320" text-anchor="middle">3</text>
  <text class="tbr" x="166" y="321">OM 曲线零点 → 得 ECS 与清晰度</text>

  <rect class="n" x="124" y="348" width="412" height="40" rx="8"/>
  <circle class="chip" cx="146" cy="368" r="10"/>
  <text class="cnum" x="146" y="372" text-anchor="middle">4</text>
  <text class="th" x="166" y="373">DSW 对齐（仅 DSW）· 记录对齐角度</text>

  <text class="tsd" x="124" y="410">任一步骤失败 → 校准失败</text>

  <rect class="n" x="170" y="470" width="320" height="56" rx="8"/>
  <text class="th" x="330" y="492" text-anchor="middle">保存校准文件</text>
  <text class="ts" x="330" y="511" text-anchor="middle">位置 · ECS · 清晰度（DSW 含角度）</text>

  <text class="th" x="124" y="592">验证 · 4 种晶圆依次执行</text>

  <rect class="n" x="124" y="604" width="412" height="40" rx="8"/>
  <circle class="chip" cx="146" cy="624" r="10"/>
  <text class="cnum" x="146" y="628" text-anchor="middle">1</text>
  <text class="th" x="166" y="629">DSW 对齐复验 · 新角度不保存不判定</text>

  <rect class="n" x="124" y="656" width="412" height="40" rx="8"/>
  <circle class="chip" cx="146" cy="676" r="10"/>
  <text class="cnum" x="146" y="680" text-anchor="middle">2</text>
  <text class="th" x="166" y="681">逐片下发 ECS · 等 3 s · 50X 重新采图</text>

  <polygon class="n" points="330,750 500,800 330,850 160,800" stroke-linejoin="round"/>
  <text class="th" x="330" y="794" text-anchor="middle">全部晶圆验证通过？</text>
  <text class="ts" x="330" y="814" text-anchor="middle">|清晰度误差| &lt; 清晰度阈值</text>

  <rect class="ok" x="220" y="886" width="220" height="44" rx="22"/>
  <text class="th" x="330" y="913" text-anchor="middle">校准验证成功</text>

  <rect class="ng" x="556" y="774" width="120" height="60" rx="10"/>
  <text class="th" x="616" y="798" text-anchor="middle">校准失败</text>
  <text class="tsd" x="616" y="818" text-anchor="middle">完整结果不保存</text>

  <rect class="capsule" x="202" y="436" width="100" height="20" rx="10"/>
  <text class="ts" x="252" y="450" text-anchor="middle">每片完成即下发</text>
  <rect class="capsule" x="340" y="856" width="24" height="20" rx="10"/>
  <text class="ts" x="352" y="870" text-anchor="middle">是</text>
  <rect class="capsule" x="515" y="772" width="22" height="20" rx="10"/>
  <text class="ts" x="526" y="786" text-anchor="middle">否</text>
</svg>
