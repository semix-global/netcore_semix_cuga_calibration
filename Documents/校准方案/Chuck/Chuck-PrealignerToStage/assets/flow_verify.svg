<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 750" width="720" height="750" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <style>
    .n { fill: #EFEFF2; stroke: rgba(23,23,23,0.16); stroke-width: 1; }
    .nb { fill: #F2F7FF; stroke: #4B3FE3; stroke-width: 1.2; }
    .ng { fill: #FDECEA; stroke: #E8463A; stroke-width: 1.2; }
    .th { fill: #171717; font-size: 14px; font-weight: 500; }
    .thb { fill: #171717; font-weight: 500; }
    .tbr { fill: #1A1759; font-size: 14px; font-weight: 500; }
    .ts { fill: #52525B; font-size: 12px; }
    .tsd { fill: #E8463A; font-size: 12px; }
    .cnum { fill: #52525B; font-size: 12px; font-weight: 500; }
    .arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .arrd { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 4; fill: none; }
    .chip { fill: #E4E4E7; }
    .note { fill: none; stroke: rgba(23,23,23,0.16); stroke-width: 1; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>

  <path class="arr" d="M260 128 V186" marker-end="url(#aw)"/>
  <path class="arr" d="M260 252 V310" marker-end="url(#aw)"/>
  <path class="arr" d="M260 376 V432" marker-end="url(#aw)"/>
  <path class="arr" d="M260 510 V584" marker-end="url(#aw)"/>
  <path class="arrd" d="M380 472 H497" marker-end="url(#aw)"/>

  <rect class="n" x="70" y="40" width="380" height="88" rx="12"/>
  <text class="th" x="86" y="67">① 加载校准记录 · Verify</text>
  <text class="ts" x="86" y="91">对当前加载的校准记录执行验证</text>
  <text class="ts" x="86" y="112">不检查是否已判定成功，未校准或默认记录也执行</text>

  <rect class="n" x="70" y="188" width="380" height="64" rx="12"/>
  <text class="th" x="86" y="215">② 带补偿重新上料</text>
  <text class="ts" x="86" y="235">按记录中已保存的补偿量执行一次 EFEM 上料</text>

  <rect class="n" x="70" y="312" width="380" height="64" rx="12"/>
  <text class="th" x="86" y="339">③ 重测残余值</text>
  <text class="ts" x="86" y="359">重测圆心偏移（X、Y 分量）与旋转角</text>

  <polygon class="n" points="140,472 260,434 380,472 260,510" stroke-linejoin="round"/>
  <text class="th" x="260" y="477" text-anchor="middle">残余值 &lt; 验证阈值？</text>

  <rect class="ng" x="500" y="436" width="188" height="72" rx="8"/>
  <text class="th" x="514" y="460">否 · 未达验证阈值</text>
  <text class="tsd" x="514" y="482">判定验证失败</text>
  <text class="tsd" x="514" y="500">保存验证失败状态</text>

  <rect class="chip" x="424" y="442" width="28" height="20" rx="10"/>
  <text class="cnum" x="438" y="456" text-anchor="middle">否</text>
  <rect class="chip" x="275" y="522" width="30" height="20" rx="10"/>
  <text class="cnum" x="290" y="536" text-anchor="middle">是</text>

  <rect class="nb" x="90" y="586" width="340" height="60" rx="28"/>
  <text class="tbr" x="260" y="610" text-anchor="middle">验证通过 · 标记已验证并保存</text>
  <text class="ts" x="260" y="630" text-anchor="middle">验证状态与残余值随记录保存</text>

  <rect class="note" x="90" y="672" width="540" height="56" rx="8"/>
  <text class="ts" x="360" y="693" text-anchor="middle"><tspan class="thb">验证边界：</tspan>按记录中已保存的补偿量执行，不重做标记点与 P5 解算</text>
  <text class="ts" x="360" y="713" text-anchor="middle">新测残余值仅用于判定与记录，不替换已保存的校准结果</text>
</svg>
